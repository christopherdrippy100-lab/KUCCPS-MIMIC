<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KUCCPS Mimic - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root { --deep-maroon: #800000; --dark-slate: #2d3748; --panel-gray: #f3f6f8; --gold: #f8c66c; --bg: #0b0b0b; }
      body { background: var(--bg); }
    </style>
  </head>
  <body class="min-h-screen antialiased">
    <div class="flex">
      <!-- Left decorative area -->
      <div class="hidden lg:block lg:w-1/2 bg-[color:var(--dark-slate)]" style="background-image:linear-gradient(135deg, rgba(0,0,0,0.4), transparent), repeating-linear-gradient(45deg, rgba(255,0,0,0.08) 0 8px, transparent 8px 16px);">
      </div>

      <!-- Right: login card -->
      <div class="w-full lg:w-1/2 flex items-center justify-center p-8">
        <div class="w-full max-w-md bg-white rounded shadow-lg">
          <div class="p-6">
            <div class="flex items-center justify-between mb-4">
              <div class="flex items-center gap-3">
                <img src="assets/logo-coat.svg" alt="Coat of arms" class="w-12 h-12" />
                <div class="text-sm font-bold text-gray-800">REPUBLIC OF KENYA</div>
              </div>
              <div class="flex items-center gap-3">
                <img src="assets/logo-kuccps.png" alt="KUCCPS" class="h-10 object-contain" />
              </div>
            </div>

            <div class="bg-white py-3 text-center text-[#2d3748] font-semibold tracking-wide">STUDENT LOGIN</div>

            <form id="loginForm" class="mt-5 space-y-3" onsubmit="return handleLogin(event)">
              <div>
                <label class="block text-xs text-gray-600">KCSE INDEX NUMBER</label>
                <div class="flex mt-2">
                  <input id="index" name="index" type="text" required placeholder="2025" class="flex-1 px-3 py-2 bg-[#fff8c9] border border-[#e0d6a8] text-gray-800 rounded" />
                  <button type="button" class="ml-2 px-3 bg-[#fff8c9] border border-[#d4b45b] rounded text-gray-600">▾</button>
                </div>
              </div>

              <div>
                <label class="block text-xs text-gray-600">Year</label>
                <select id="year" name="year" class="w-full mt-2 px-3 py-2 bg-white border border-gray-200 rounded">
                  <option>2025</option>
                  <option>2024</option>
                  <option>2023</option>
                </select>
              </div>

              <div>
                <label class="block text-xs text-gray-600">Password</label>
                <input id="password" name="password" type="password" required placeholder="Use Birth Certificate or KCPE Index" class="w-full mt-2 px-3 py-2 bg-[#fff8c9] border border-[#e0d6a8] rounded text-gray-800" />
                <div class="mt-3 border-l-4 border-[var(--deep-maroon)] bg-[#f7f7f7] p-3 text-xs text-gray-700">— Use Your Birth Certificate No. or KCPE Index No (as used in KCSE Exam Registration) as your Initial Password</div>
              </div>

              <div class="flex gap-3 mt-4">
                <button type="submit" class="flex-1 bg-[var(--deep-maroon)] text-white py-2 rounded font-semibold">LOG IN</button>
                <button type="button" onclick="location.href='index.html'" class="flex-1 bg-gray-100 text-[#2d3748] py-2 rounded border border-gray-300">BACK TO HOME</button>
              </div>
            </form>
          </div>

          <!-- sticky footer block inside card for mimic -->
          <div class="bg-[#3f4750] text-white p-3 text-sm">
            <div class="flex justify-between items-center">
              <div>
                <div>Application deadline in: <span id="app-deadline-short">--:--:--</span></div>
                <div>Transfer deadline in: <span id="transfer-deadline-short">--:--:--</span></div>
              </div>
              <div class="text-right">Copyright © 2026 | KUCCPS</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
